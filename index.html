<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GermanQuest — Learn German A1→B2 in 120 Days (offline game)</title>
<meta name="description" content="GermanQuest: a fully offline, single-file language-learning game. 120-day curriculum (3,600 German-English sentences, A1-B2), spaced repetition, retrieval practice, dictation, word-order building, audio, streaks, XP, badges and phase tests.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b111d;--bg2:#101a2b;--card:#16233a;--card2:#1d2f4d;--line:#2a3d5e;--ink:#eaf1fb;--mut:#8fa6c4;--gold:#ffc857;--green:#4cd97b;--red:#ff6b6b;--blue:#5aa9ff;--purple:#b48cff;--r:14px}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#1b3050 0%,var(--bg) 55%) fixed;color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:980px;margin:0 auto;padding:18px 16px 90px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 2px 14px}
.logo{font-size:24px;font-weight:800;letter-spacing:.3px}
.logo b{color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.chip b{color:var(--ink)}
nav.bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
nav.bar button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
nav.bar button.on,nav.bar button:hover{background:var(--card2);color:var(--ink);border-color:var(--blue)}
h1{font-size:26px;margin:4px 0 10px}
h2{font-size:19px;margin:18px 0 8px}
p.lead{color:var(--mut);max-width:70ch}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:700}
.card .big{font-size:30px;font-weight:800;margin-top:2px}
.card .sub{font-size:12.5px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#2b62c9,#1d4ed8);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(29,78,216,.35)}
.btn:hover{filter:brightness(1.12)}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#f4a926);color:#3a2b00;box-shadow:0 6px 18px rgba(244,169,38,.35)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:none;font-weight:600}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.barwrap{height:10px;background:#0a1322;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.barfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .4s}
.barfill.gold{background:linear-gradient(90deg,var(--gold),#ff9f43)}
.phase{margin:14px 0}
.phase .ph-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phase .lv{font-weight:800;font-size:16px}
.phase .rng{color:var(--mut);font-size:13px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:8px}
.day{position:relative;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:8px 4px 6px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut)}
.day b{display:block;font-size:15px;color:var(--ink)}
.day .st{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase}
.day.locked{opacity:.38;cursor:not-allowed}
.day.now{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,87,.25)}
.day.done .st{color:var(--green)}
.day.part .st{color:var(--gold)}
.day:hover:not(.locked){border-color:var(--blue)}
.sess{max-width:760px;margin:0 auto}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--mut);font-size:13.5px}
.qcard{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.qtag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#06131f;background:var(--gold);border-radius:6px;padding:3px 8px;margin-bottom:10px}
.qtag.t1{background:var(--blue);color:#04101f}
.qtag.t2{background:var(--purple);color:#150826}
.qtag.t3{background:var(--green);color:#03180c}
.prompt{font-size:21px;font-weight:600;margin:6px 0 4px}
.prompt .de{color:var(--gold)}
.hintline{color:var(--mut);font-size:13.5px;margin-bottom:14px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--blue);background:var(--card2)}
.opt.good{border-color:var(--green);background:rgba(76,217,123,.14)}
.opt.bad{border-color:var(--red);background:rgba(255,107,107,.12)}
.opt kbd{margin-right:8px;background:#0a1322;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mut)}
input.tin{width:100%;background:#0a1322;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:13px 14px;font-size:17px;outline:none}
input.tin:focus{border-color:var(--blue)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;min-height:52px}
.wchip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;user-select:none}
.wchip:hover{border-color:var(--blue)}
.wchip.used{opacity:.28;pointer-events:none}
.ansline{background:#0a1322;border:1px dashed var(--line);border-radius:12px;min-height:52px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ansline .wchip{background:var(--card)}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.fb.ok{background:rgba(76,217,123,.10);border-color:rgba(76,217,123,.5)}
.fb.no{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.5)}
.fb .verdict{font-weight:800;font-size:17px;margin-bottom:6px}
.fb.ok .verdict{color:var(--green)} .fb.no .verdict{color:var(--red)}
.fb .de{font-size:18px;color:var(--gold);font-weight:600}
.fb .en{color:var(--mut);font-size:14.5px;margin-top:2px}
.fb .tip{font-size:13.5px;color:var(--mut);margin-top:8px}
.word-diff del{color:var(--red);text-decoration:line-through;opacity:.85}
.word-diff ins{color:var(--green);text-decoration:none;font-weight:700}
.xp-pop{position:fixed;right:26px;top:74px;background:var(--gold);color:#3a2b00;font-weight:900;border-radius:10px;padding:6px 12px;animation:pop 1.1s ease forwards;pointer-events:none;z-index:60}
@keyframes pop{0%{transform:translateY(8px) scale(.8);opacity:0}25%{transform:translateY(0) scale(1.05);opacity:1}80%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.sci{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:12px}
.sci .card p{color:var(--mut);font-size:14px;margin-top:6px}
.sci .card h3{color:var(--gold);text-transform:none;font-size:16px;letter-spacing:0}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mut)}
.badge.got{border-color:var(--gold);color:var(--ink);background:rgba(255,200,87,.10)}
.badge b{display:block;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:84vh;overflow:auto}
label.sw{display:flex;gap:10px;align-items:center;margin:10px 0;color:var(--ink);font-size:15px;cursor:pointer}
textarea{width:100%;background:#0a1322;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;height:110px}
footer{color:var(--mut);font-size:12.5px;text-align:center;margin-top:30px}
.mini{font-size:12.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--blue);color:var(--ink);border-radius:12px;padding:10px 18px;font-size:14.5px;z-index:70;animation:pop 2.4s ease forwards}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:30px auto;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:600px){.prompt{font-size:18px}.qcard{padding:16px}}
</style>
</head>
<body>
<script>window.__DATA__="PLACEHOLDER_WILL_BE_FILLED_BY_BUILD";</script>
</body>
</html>
