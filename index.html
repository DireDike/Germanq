<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GermanQuest A1→B2</title>
<style>
*{box-sizing:border-box}body{margin:0;font:17px system-ui,sans-serif;background:#0b111d;color:#eaf1fb}
#app{max-width:760px;margin:auto;padding:16px}h1{margin:.2em 0}.mut{color:#8fa6c4}
.card{background:#16233a;border:1px solid #2a3d5e;border-radius:14px;padding:16px;margin:12px 0}
button{background:#1d4ed8;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:16px;margin:4px;cursor:pointer}
button.g{background:#2a3d5e}
input{width:100%;padding:12px;font-size:18px;border-radius:10px;border:1px solid #2a3d5e;background:#0b111d;color:#fff}
.bar{height:10px;background:#2a3d5e;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#ffc857}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{flex:1;min-width:110px;background:#101a2b;border-radius:10px;padding:10px;text-align:center}
.big{font-size:26px;font-weight:700}.tile{background:#2a3d5e}
</style></head><body><div id="app"></div>
<script>
const L=[ // [level, German, English]
["A1","Hallo, ich heiße Anna.","Hello, my name is Anna."],["A1","Wie geht es dir?","How are you?"],["A1","Mir geht es gut, danke.","I am fine, thanks."],
["A1","Ich komme aus England.","I come from England."],["A1","Ich wohne in Berlin.","I live in Berlin."],["A1","Das ist mein Bruder.","That is my brother."],
["A1","Ich trinke gern Kaffee.","I like drinking coffee."],["A1","Wo ist der Bahnhof?","Where is the train station?"],["A1","Ich habe einen Hund.","I have a dog."],
["A1","Wie viel kostet das?","How much does that cost?"],["A1","Ich bin müde.","I am tired."],["A1","Heute ist Montag.","Today is Monday."],
["A1","Ich lerne Deutsch.","I am learning German."],["A1","Wir essen um sieben Uhr.","We eat at seven o'clock."],["A1","Das Wetter ist schön.","The weather is nice."],
["A1","Ich brauche Hilfe.","I need help."],["A1","Sprechen Sie Englisch?","Do you speak English?"],["A1","Ich verstehe das nicht.","I don't understand that."],
["A1","Meine Mutter arbeitet viel.","My mother works a lot."],["A1","Der Tisch ist groß.","The table is big."],
["A2","Gestern bin ich ins Kino gegangen.","Yesterday I went to the cinema."],["A2","Ich habe den Film schon gesehen.","I have already seen the film."],
["A2","Kannst du mir helfen?","Can you help me?"],["A2","Ich muss morgen früh aufstehen.","I have to get up early tomorrow."],
["A2","Wir fahren mit dem Zug nach München.","We are going to Munich by train."],["A2","Ich gebe dem Kind das Buch.","I give the child the book."],
["A2","Weil ich krank war, bin ich zu Hause geblieben.","Because I was sick, I stayed at home."],["A2","Das Restaurant ist neben der Bank.","The restaurant is next to the bank."],
["A2","Ich interessiere mich für Musik.","I am interested in music."],["A2","Er ist größer als sein Bruder.","He is taller than his brother."],
["A2","Ich würde gern ein Zimmer reservieren.","I would like to book a room."],["A2","Ruf mich bitte heute Abend an.","Please call me this evening."],
["A2","Als Kind wohnte ich auf dem Land.","As a child I lived in the countryside."],["A2","Ich freue mich auf das Wochenende.","I am looking forward to the weekend."],
["A2","Ich habe keine Zeit, weil ich arbeiten muss.","I have no time because I have to work."],["A2","Zieh dir eine Jacke an!","Put on a jacket!"],
["B1","Wenn ich Zeit hätte, würde ich mehr reisen.","If I had time, I would travel more."],["B1","Das Buch, das ich lese, ist spannend.","The book that I am reading is exciting."],
["B1","Obwohl es regnete, sind wir spazieren gegangen.","Although it was raining, we went for a walk."],["B1","Ich habe vergessen, die Tür abzuschließen.","I forgot to lock the door."],
["B1","Das Haus wird gerade renoviert.","The house is being renovated right now."],["B1","Nachdem wir gegessen hatten, gingen wir nach Hause.","After we had eaten, we went home."],
["B1","Es lohnt sich, Deutsch zu lernen.","It is worth learning German."],["B1","Ich bin mir nicht sicher, ob er kommt.","I am not sure whether he is coming."],
["B1","Je mehr ich übe, desto besser spreche ich.","The more I practise, the better I speak."],["B1","Ich hätte dich anrufen sollen.","I should have called you."],
["B1","Trotz des Regens fand das Konzert statt.","Despite the rain, the concert took place."],["B1","Ich beschäftige mich mit Geschichte.","I occupy myself with history."],
["B1","Sie tut so, als ob sie nichts wüsste.","She acts as if she knew nothing."],["B1","Damit ich pünktlich bin, nehme ich ein Taxi.","So that I am on time, I take a taxi."],
["B2","Der Vertrag muss bis Freitag unterschrieben worden sein.","The contract must have been signed by Friday."],
["B2","Angesichts der Lage sollten wir abwarten.","In view of the situation we should wait."],["B2","Er soll sehr reich sein.","He is said to be very rich."],
["B2","Die Entscheidung ist noch nicht gefallen.","The decision has not yet been made."],["B2","Es kommt darauf an, wie man es betrachtet.","It depends on how you look at it."],
["B2","Hätte ich das gewusst, wäre ich gekommen.","Had I known that, I would have come."],["B2","Die zu erledigenden Aufgaben liegen auf dem Tisch.","The tasks to be done are on the table."],
["B2","Er behauptete, er sei krank gewesen.","He claimed he had been ill."],["B2","Im Gegensatz zu früher arbeiten viele im Homeoffice.","In contrast to the past, many work from home."],
["B2","Ich lege großen Wert auf Ehrlichkeit.","I place great value on honesty."],["B2","Dieses Problem lässt sich leicht lösen.","This problem can easily be solved."],
["B2","Kaum war er angekommen, fing es an zu regnen.","Hardly had he arrived when it started to rain."],["B2","Es ist fraglich, inwiefern das stimmt.","It is questionable to what extent that is true."]
];
const PHASE=d=>d<=30?"A1":d<=60?"A2":d<=90?"B1":"B2", LV=["A1","A2","B1","B2"], NEW_PER_DAY=8, IV=[0,1,3,7,14,30,60,120];
let S=JSON.parse(localStorage.gq||"null")||{start:Date.now(),cards:{},xp:0,streak:0,last:""};
const save=()=>localStorage.gq=JSON.stringify(S), today=()=>new Date().toISOString().slice(0,10);
const day=()=>Math.min(120,Math.floor((Date.now()-S.start)/864e5)+1), $=id=>document.getElementById(id), A=document.getElementById("app");
const norm=s=>s.toLowerCase().replace(/[.,!?;:'"]/g,"").replace(/ß/g,"ss").replace(/\s+/g," ").trim();
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function queue(){const now=Date.now(),max=LV.indexOf(PHASE(day())),due=[],fresh=[];
 L.forEach((x,i)=>{const c=S.cards[i];if(c){if(c.due<=now)due.push(i)}else if(LV.indexOf(x[0])<=max)fresh.push(i)});
 const introduced=Object.values(S.cards).filter(c=>c.d===today()).length;
 return shuffle(due).concat(fresh.slice(0,Math.max(0,NEW_PER_DAY-introduced)))}
function grade(i,ok){const c=S.cards[i]||{box:0,d:today()};c.box=ok?Math.min(IV.length-1,c.box+1):Math.max(1,c.box-2)||1;
 c.due=Date.now()+(ok?IV[c.box]*864e5:6e4);S.cards[i]=c;if(ok)S.xp+=10;
 if(S.last!==today()){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=today()}save()}
function home(){const d=day(),learned=Object.values(S.cards).filter(c=>c.box>=4).length,q=queue();
 A.innerHTML=`<h1>🇩🇪 GermanQuest</h1><p class=mut>Day ${d}/120 · Phase ${PHASE(d)} · target: B2 in 4 months</p>
 <div class=bar><i style="width:${d/1.2}%"></i></div>
 <div class="card stats"><div><div class=big>${S.xp}</div>XP</div><div><div class=big>🔥${S.streak}</div>streak</div>
 <div><div class=big>${learned}/${L.length}</div>mastered</div><div><div class=big>${q.length}</div>due today</div></div>
 <div class=card><b>Today's plan (~20–30 min):</b><br>1. Review due cards (spaced repetition)<br>2. Learn ${NEW_PER_DAY} new sentences<br>3. Listen & shadow each sentence aloud<br>4. Extra: 15 min German podcast/series (comprehensible input)</div>
 <button onclick="session()">▶ Start session</button><button class=g onclick="skip()">Unlock next phase</button><button class=g onclick="if(confirm('Reset all progress?')){localStorage.removeItem('gq');location.reload()}">Reset</button>`}
function skip(){S.start-=30*864e5;save();home()}
let Q=[],cur=0,ok=0;
function session(){Q=queue().slice(0,25);cur=0;ok=0;if(!Q.length){A.innerHTML=`<div class=card><h2>✅ All done for today!</h2><p>Come back tomorrow — spacing beats cramming.</p><button onclick=home()>Home</button></div>`;return}next()}
function next(){if(cur>=Q.length){A.innerHTML=`<div class=card><h2>Session complete 🎉</h2><p>${ok}/${Q.length} correct · +${ok*10} XP</p><button onclick=home()>Home</button></div>`;return}
 const i=Q[cur],[lv,de,en]=L[i],c=S.cards[i],t=!c?"intro":["type","build","listen","choice"][Math.random()*4|0];
 const head=`<p class=mut>${cur+1}/${Q.length} · ${lv}</p><div class=bar><i style="width:${cur/Q.length*100}%"></i></div>`;
 if(t==="intro"){speak(de);A.innerHTML=head+`<div class=card><p class=mut>New sentence — listen & repeat aloud 3×</p><h2>${de}</h2><p>${en}</p>
  <button class=g onclick="speak('${de.replace(/'/g,"\\'")}')">🔊 Listen</button><button onclick="grade(${i},true);cur++;ok++;next()">Got it →</button></div>`;return}
 if(t==="choice"){const opts=shuffle([de,...shuffle(L.filter((x,j)=>j!==i&&x[0]===lv).map(x=>x[1])).slice(0,3)]);
  A.innerHTML=head+`<div class=card><p class=mut>Choose the German for:</p><h2>${en}</h2>${opts.map(o=>`<div><button class=g style="width:100%;text-align:left">${o}</button></div>`).join("")}<div id=fb></div></div>`;
  A.querySelectorAll(".card button").forEach(b=>b.onclick=()=>check(b.textContent===de,i,de,en));return}
 if(t==="build"){let words=de.replace(/[.,!?]/g,"").split(" "),built=[];
  A.innerHTML=head+`<div class=card><p class=mut>Build the sentence (word order!):</p><h2>${en}</h2><div id=out style="min-height:44px;border-bottom:1px solid #2a3d5e"></div><div id=pool></div><button>Check</button><div id=fb></div></div>`;
  const draw=()=>{$("out").innerHTML=built.map((w,k)=>`<button class=tile data-k=${k}>${w}</button>`).join("");
   $("pool").innerHTML=pool.map((w,k)=>w?`<button class=tile data-p=${k}>${w}</button>`:"").join("");
   $("out").querySelectorAll("button").forEach(b=>b.onclick=()=>{const w=built.splice(+b.dataset.k,1)[0];pool[pool.indexOf(null)]=w;draw()});
   $("pool").querySelectorAll("button").forEach(b=>b.onclick=()=>{built.push(pool[+b.dataset.p]);pool[+b.dataset.p]=null;draw()})};
  let pool=shuffle(words);draw();A.querySelector(".card>button").onclick=()=>check(norm(built.join(" "))===norm(de),i,de,en);return}
 if(t==="listen")speak(de);
 A.innerHTML=head+`<div class=card><p class=mut>${t==="listen"?"Dictation: type what you hear":"Translate into German:"}</p>
 <h2>${t==="listen"?`<button class=g onclick="speak('${de.replace(/'/g,"\\'")}')">🔊 Play again</button>`:en}</h2>
 <input id=ans autocomplete=off placeholder="Deutsch…"><p class=mut>ä ö ü ß: type ae oe ue ss if needed</p><button id=chk>Check</button><div id=fb></div></div>`;
 const go=()=>{const a=norm($("ans").value).replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü"),b=norm(de);check(a===b||norm($("ans").value)===b.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue"),i,de,en)};
 $("chk").onclick=go;$("ans").onkeydown=e=>{if(e.key==="Enter")go()};$("ans").focus()}
function check(r,i,de,en){if($("fb").dataset.done)return;$("fb").dataset.done=1;grade(i,r);if(r)ok++;else if(Q.length<40)Q.push(i);speak(de);
 $("fb").innerHTML=`<p style="color:${r?"#4cd97b":"#ff6b6b"}">${r?"✔ Richtig!":"✘ Correct answer:"}</p><h3>${de}</h3><p class=mut>${en}</p><button id=nx>Next →</button>`;
 $("nx").onclick=()=>{cur++;next()};$("nx").focus()}
home();
</script></body></html>
